<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Word Cloud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="languageSwitcher">
            <button id="langEn">English</button>
            <button id="langHe">עברית</button>
        </div>
        <h1 id="mainTitle">Daily Word Cloud</h1>
        
        <h2 id="questionTitle">Global Warming</h2>
        
        <p id="totalReactions">Today people already reacted: 0</p>
        <p id="unlockText">React to unlock the chart</p>
        
        <div id="answerBox">
            <input
                type="text"
                id="wordInput"
                placeholder="Enter your first thought..."
            >
        
            <button id="submitBtn">
                Submit
            </button>
        </div>
        
        <div id="message"></div>
        
        <div id="results" style="display: none;">
            <div class="resultsArea">
                <div id="wordCloud"></div>
                <div id="wordStats"></div>
            </div>
        </div>

    <script type="module" src="script.js"></script>

</body>
</html>
