<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Word Cloud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Daily Word Cloud</h1>

        <h2>Global Warming</h2>

        <div id="answerBox">
            <input
                type="text"
                id="wordInput"
                placeholder="Enter your first thought..."
            >
        
            <button id="submitBtn">
                Submit
            </button>
        </div>
        
        <div id="message"></div>
        
        <div class="resultsArea">
            <div id="wordCloud"></div>
            <div id="wordStats"></div>
        </div>

    <script type="module" src="script.js"></script>

</body>
</html>
